    <style>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- GEMINI API HELPER CONFIG ---
        const apiKey = ""; // Set dynamically by environment or custom override field

        const getActiveApiKey = () => {
            return apiKey || window.GEMINI_API_KEY || localStorage.getItem('jeopardy_gemini_api_key') || '';
        };

        const getCustomAudioUrl = () => {
            // Uses the user uploaded mp3 file as the absolute default direct path
            return localStorage.getItem('jeopardy_custom_audio_url') || 'jeopardy-final-jeopardy-thinking-music (1).mp3';
        };

        const fetchWithRetry = async (url, options, retries = 5, delay = 1000) => {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                }
                throw error;
            }
        };

        const callGeminiAPI = async (prompt, systemPrompt, expectedSchema) => {
            const key = getActiveApiKey();
            if (!key) {
                throw new Error("No Gemini API key found. Please supply an API key in the Setup Settings Gear ⚙️.");
            }
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: expectedSchema
                }
            };

            const data = await fetchWithRetry(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) {
                throw new Error("Empty response received from the AI service.");
            }
            return JSON.parse(text);
        };

        // --- AUDIO ENGINE ---
        const playTone = (freq, type, duration) => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio Context blocked or unsupported.");
            }
        };

        const playSound = (name) => {
            switch(name) {
                case 'correct':
                    playTone(587.33, 'sine', 0.12); // D5
                    setTimeout(() => playTone(880, 'sine', 0.25), 120); // A5
                    break;
                case 'wrong':
                    playTone(180, 'sawtooth', 0.25);
                    setTimeout(() => playTone(130, 'sawtooth', 0.35), 180);
                    break;
                case 'dailyDouble':
                    [330, 440, 554, 659, 880].forEach((f, i) => {
                        setTimeout(() => playTone(f, 'square', 0.12), i * 90);
                    });
                    break;
                case 'win':
                    const victoryChords = [523.25, 659.25, 783.99, 1046.50]; // C Major
                    victoryChords.forEach((f, i) => {
                        setTimeout(() => playTone(f, 'triangle', 0.3), i * 150);
                    });
                    break;
            }
        };

        // Synthesized jeopardy think music helpers (fallback)
        let activeSynthOscillators = [];
        const playSequencedNote = (freq, type, duration, audioCtx) => {
            if (freq === 0) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
                
                const nodeRecord = { osc, gain };
                activeSynthOscillators.push(nodeRecord);
                setTimeout(() => {
                    activeSynthOscillators = activeSynthOscillators.filter(item => item !== nodeRecord);
                }, duration * 1000 + 100);
            } catch (e) {
                console.log("Synthesizer scheduling issue: ", e);
            }
        };

        const stopThinkMusicSynthesizer = () => {
            activeSynthOscillators.forEach(item => {
                try {
                    item.osc.stop();
                    item.gain.disconnect();
                } catch(e) {}
            });
            activeSynthOscillators = [];
        };

        // Classic simplified Jeopardy melody sequence
        const jeopardyMelody = [
            { note: 523.25, dur: 0.3 }, // C5
            { note: 698.46, dur: 0.3 }, // F5
            { note: 523.25, dur: 0.3 }, // C5
            { note: 698.46, dur: 0.3 }, // F5
            { note: 523.25, dur: 0.3 }, // C5
            { note: 698.46, dur: 0.3 }, // F5
            { note: 880.00, dur: 0.6 }, // A5
            { note: 0, dur: 0.1 },      // Rest
            
            { note: 523.25, dur: 0.3 }, // C5
            { note: 698.46, dur: 0.3 }, // F5
            { note: 523.25, dur: 0.3 }, // C5
            { note: 698.46, dur: 0.3 }, // F5
            { note: 880.00, dur: 0.5 }, // A5
            { note: 783.99, dur: 0.5 }, // G5
            { note: 698.46, dur: 0.3 }, // F5
            { note: 0, dur: 0.1 },      // Rest

            { note: 523.25, dur: 0.3 }, // C5
            { note: 698.46, dur: 0.3 }, // F5
            { note: 523.25, dur: 0.3 }, // C5
            { note: 698.46, dur: 0.3 }, // F5
            { note: 523.25, dur: 0.3 }, // C5
            { note: 698.46, dur: 0.3 }, // F5
            { note: 880.00, dur: 0.3 }, // A5
            { note: 698.46, dur: 0.3 }, // F5

            { note: 587.33, dur: 0.3 }, // D5
            { note: 523.25, dur: 0.3 }, // C5
            { note: 466.16, dur: 0.3 }, // Bb4
            { note: 440.00, dur: 0.3 }, // A4
            { note: 392.00, dur: 0.3 }, // G4
            { note: 349.23, dur: 0.6 }, // F4
            { note: 0, dur: 0.4 }       // Rest
        ];

        // --- BLANK BOARD BUILDER ---
        const generateBlankTemplate = () => {
            const categories = [];
            for (let c = 1; c <= 5; c++) {
                const questions = [];
                for (let r = 1; r <= 5; r++) {
                    const points = r * 100;
                    questions.push({
                        points: points,
                        q: `This is your Question ${r} for Category ${c} (Value: $${points}). Click inside to edit.`,
                        a: `Answer ${c}-${points}`,
                        core: `Answer ${c}-${points}`,
                        prefix: "What is"
                    });
                }
                categories.push({
                    category: `Category ${c}`,
                    questions: questions
                });
            }
            return {
                id: 'default-blank-board',
                title: "Template Jeopardy Board",
                categories: categories,
                finalJeopardy: {
                    category: "Final Category Name",
                    question: "This is the question prompt or riddle for Final Jeopardy. Edit it in the final tab.",
                    core: "Final Answer",
                    prefix: "What is"
                }
            };
        };

        // =========================================================================
        // 🎴 CUSTOM PRE-LOADED GAME CONFIGURATION
        // =========================================================================
        // When you embed this game, visitors won't have access to your computer's
        // browser Local Storage. To make sure your custom trivia loads automatically
        // for everyone, you can paste your custom game data here!
        //
        // HOW TO GET YOUR DATA:
        // 1. Build your board in the Editor inside the preview.
        // 2. Click "Save Game".
        // 3. To hardcode it forever, copy the JSON configuration or replace this
        //    variable with your custom game object structure.
        // =========================================================================
        const customPreloadedGame = {
            id: 'preloaded-reconstruction',
            title: "Reconstruction Era Jeopardy",
            categories: [
                {
                    category: "The Reconstruction Amendments",
                    questions: [
                        { points: 200, q: "This amendment officially outlawed slavery and involuntary servitude across the entire United States.", core: "the 13th Amendment?", prefix: "What is" },
                        { points: 400, q: "This amendment defined citizenship to include all persons born or naturalized in the U.S. and guaranteed \"equal protection under the law\".", core: "the 14th Amendment?", prefix: "What is" },
                        { points: 600, q: "This amendment declared that the right of citizens to vote cannot be denied based on race, color, or previous condition of servitude.", core: "the 15th Amendment?", prefix: "What is" },
                        { points: 800, q: "The Citizenship Clause of the 14th Amendment was designed to directly overturn this 1857 Supreme Court decision.", core: "Dred Scott v. Sandford?", prefix: "What is" },
                        { points: 1000, q: "Although it guarantees fair treatment, the 14th Amendment’s Equal Protection Clause only restricts the actions of state and local governments, meaning it does not legally apply to these entities.", core: "private businesses?", prefix: "What are" }
                    ]
                },
                {
                    category: "Politics and Conflict",
                    questions: [
                        { points: 200, q: "His 1865 assassination left the difficult task of Reconstruction to Andrew Johnson.", core: "Abraham Lincoln?", prefix: "Who is" },
                        { points: 400, q: "Radical Republicans in 1865 strongly opposed Andrew Johnson's Reconstruction plans because they felt they were too much of this.", core: "\"too lenient\"?", prefix: "What is" },
                        { points: 600, q: "This 1867 Act dissolved Southern state governments and divided the South into five military districts.", core: "the Reconstruction Act?", prefix: "What is" },
                        { points: 800, q: "This was the official reason given by the House of Representatives for impeaching President Andrew Johnson in 1868.", core: "violating the Tenure of Office Act?", prefix: "What is" },
                        { points: 1000, q: "This group of Congressmen, led by Thaddeus Stevens and Charles Sumner, wanted to destroy the political power of former slaveholders.", core: "Radical Republicans?", prefix: "Who are" }
                    ]
                },
                {
                    category: "Black Codes and Jim Crow",
                    questions: [
                        { points: 200, q: "Under this system, landless farmers (mostly former slaves) worked a section of land in exchange for a portion of the harvest.", core: "sharecropping?", prefix: "What is" },
                        { points: 400, q: "These local and state laws passed in the South immediately after the Civil War severely restricted African Americans' freedom and compelled them to work in a labor economy based on low wages.", core: "Black Codes?", prefix: "What are" },
                        { points: 600, q: "These laws, named after a popular minstrel show character, legally segregated whites and blacks in public spaces throughout the South.", core: "Jim Crow laws?", prefix: "What are" },
                        { points: 800, q: "Southern states used these taxes, along with literacy tests, as a legal loophole to prevent African Americans' from voting without violating the 15th Amendment.", core: "poll taxes?", prefix: "What are" },
                        { points: 1000, q: "Under the Black Codes, any African American without a signed one of these agreements with a white employer could be arrested for \"vagrancy\" and have their labor auctioned off.", core: "a labor contract?", prefix: "What is" }
                    ]
                },
                {
                    category: "Economic Reconstruction",
                    questions: [
                        { points: 200, q: "Established by Congress in 1865, this agency provided food, housing, medical aid, and established schools for newly freed African Americans.", core: "the Freedmen's Bureau?", prefix: "What is" },
                        { points: 400, q: "This phrase refers to the widespread rumor and expectation among freed people that the federal government would redistribute Southern plantation land to them.", core: "\"forty acres and a mule\"?", prefix: "What is" },
                        { points: 600, q: "In 1865, Union General William Tecumseh Sherman issued this order, which set aside a large swath of the Southern coast for settlement by newly freed families.", core: "Special Field Order No. 15?", prefix: "What is" },
                        { points: 800, q: "The vast majority of Southern rail lines, bridges, and cities lay in ruins after the war, largely due to this Union military strategy of total destruction.", core: "\"scorched earth\" strategy?", prefix: "What is" },
                        { points: 1000, q: "According to economic data, the decline of this specific industry hurt the South the most because they held 84% of the nation's large farms.", core: "agriculture?", prefix: "What is" }
                    ]
                },
                {
                    category: "Names and Terms",
                    questions: [
                        { points: 200, q: "This derogatory term was used by white Southern conservatives for fellow Southerners who joined the Republican party.", core: "scalawags?", prefix: "What are" },
                        { points: 400, q: "This derogatory term described Northerners who moved south after the war, often depicted as opportunists looking to steal tax dollars.", core: "carpetbaggers?", prefix: "What are" },
                        { points: 600, q: "In this 1896 case, the Supreme Court ruled that segregation was legal as long as facilities for blacks and whites were \"equal\".", core: "Plessy v. Ferguson?", prefix: "What is" },
                        { points: 800, q: "Reconstruction officially ended because of this 1877 agreement that removed federal troops from the South.", core: "the Compromise of 1877?", prefix: "What is" },
                        { points: 1000, q: "To combat secret societies and midnight violence, Congress passed this 1870 law making it a federal crime to \"go in disguise upon the public highway\" to intimidate citizens from voting.", core: "the Enforcement Act?", prefix: "What is" }
                    ]
                }
            ],
            finalJeopardy: {
                category: "Historical Speeches",
                question: "In his 1865 speech \"What the Black Man Wants,\" this famous abolitionist argued that true freedom meant the government should \"Do nothing with us!... give him a chance to stand on his own legs!\"",
                core: "Frederick Douglass",
                prefix: "Who is"
            }
        };

        const defaultGameData = customPreloadedGame || generateBlankTemplate();

        // --- STORAGE UTILS ---
        const saveGameToStorage = (game) => {
            const savedGames = JSON.parse(localStorage.getItem('jeopardy_games') || '[]');
            const existingIndex = savedGames.findIndex(g => g.id === game.id);
            if (existingIndex >= 0) {
                savedGames[existingIndex] = game;
            } else {
                savedGames.push(game);
            }
            localStorage.setItem('jeopardy_games', JSON.stringify(savedGames));
        };

        const loadGamesFromStorage = () => {
            const saved = localStorage.getItem('jeopardy_games');
            let games = saved ? JSON.parse(saved) : [];
            return games.map(g => ({
                ...g,
                id: g.id || `game-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`
            }));
        };

        const deleteGameFromStorage = (gameId) => {
            const savedGames = JSON.parse(localStorage.getItem('jeopardy_games') || '[]');
            const filtered = savedGames.filter(g => g.id !== gameId);
            localStorage.setItem('jeopardy_games', JSON.stringify(filtered));
            return filtered;
        };

        // --- CUSTOM APP DIALOG MODAL (Removes Browser Alerts) ---
        function DialogModal({ isOpen, type, title, message, onConfirm, onCancel, confirmText = "Confirm", cancelText = "Cancel" }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 animate-fade-in">
                    <div className="bg-slate-900 border-2 border-yellow-500 rounded-xl p-6 max-w-md w-full shadow-2xl">
                        <h3 className="text-xl font-bold text-yellow-400 mb-2">{title}</h3>
                        <p className="text-slate-300 text-sm mb-6 leading-relaxed">{message}</p>
                        <div className="flex justify-end gap-3">
                            {type === 'confirm' && (
                                <button onClick={onCancel} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded transition text-sm">
                                    {cancelText}
                                </button>
                            )}
                            <button onClick={onConfirm} className="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold px-5 py-2 rounded transition text-sm">
                                {type === 'alert' ? 'OK' : confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- PRINT UTILS ---
        const printHostKey = (game) => {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                    <head>
                        <title>Host Guide - ${game.title}</title>
                        <style>
                            body { font-family: sans-serif; padding: 20px; color: #111; }
                            h1 { margin-bottom: 5px; }
                            .grid { display: grid; grid-template-columns: repeat(${game.categories.length}, 1fr); gap: 15px; border: 2px solid #000; margin-top: 15px; }
                            .column { border-right: 1px solid #000; display: flex; flex-direction: column; }
                            .column:last-child { border-right: none; }
                            .header { background: #ddd; font-weight: bold; text-align: center; padding: 12px; border-bottom: 2px solid #000; text-transform: uppercase; }
                            .cell { padding: 10px; border-bottom: 1px solid #ccc; font-size: 11px; flex: 1; }
                            .cell:last-child { border-bottom: none; }
                            .points { font-weight: bold; color: #ca8a04; display: block; margin-bottom: 2px; }
                            .q { font-style: italic; margin-bottom: 5px; }
                            .a { font-weight: bold; color: #166534; }
                            .final-section { margin-top: 30px; border: 3px double #000; padding: 15px; background: #fafafa; }
                            @media print { @page { size: landscape; margin: 0.4in; } }
                        </style>
                    </head>
                    <body>
                        <h1>Jeopardy Host Key: ${game.title}</h1>
                        <p>Keep this printed key behind your podium to evaluate answers.</p>
                        <div class="grid">
                            ${game.categories.map(cat => `
                                <div class="column">
                                    <div class="header">${cat.category}</div>
                                    ${cat.questions.map(q => `
                                        <div class="cell">
                                            <span class="points">$${q.points}</span>
                                            <div class="q">Q: ${q.q}</div>
                                            <div class="a">A: ${q.core}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            `).join('')}
                        </div>
                        <div class="final-section">
                            <h3>FINAL JEOPARDY</h3>
                            <p><strong>Category:</strong> ${game.finalJeopardy.category}</p>
                            <p><strong>Clue/Prompt:</strong> ${game.finalJeopardy.question}</p>
                            <p><strong>Response Target:</strong> ${game.finalJeopardy.prefix} ${game.finalJeopardy.core}?</p>
                        </div>
                        <script>window.print();<\/script>
                    </body>
                </html>
            `);
            printWindow.document.close();
        };

        // --- APP COMPONENTS ---

        function GameEditor({ game, onSave, onSaveAsCopy, onCancel, showToast, isFullscreen, onToggleFullscreen }) {
            const [editedGame, setEditedGame] = useState(JSON.parse(JSON.stringify(game)));
            const [activeTab, setActiveTab] = useState('categories');
            
            // AI Generator State
            const [boardPrompt, setBoardPrompt] = useState("");
            const [catPrompt, setCatPrompt] = useState("");
            const [aiTargetCatIdx, setAiTargetCatIdx] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);

            const handleCategoryChange = (catIdx, value) => {
                const newCats = [...editedGame.categories];
                newCats[catIdx].category = value;
                setEditedGame({...editedGame, categories: newCats});
            };

            const handleQuestionChange = (catIdx, qIdx, field, value) => {
                const newCats = [...editedGame.categories];
                newCats[catIdx].questions[qIdx][field] = value;
                setEditedGame({...editedGame, categories: newCats});
            };

            const handleFinalChange = (field, value) => {
                setEditedGame({...editedGame, finalJeopardy: {...editedGame.finalJeopardy, [field]: value}});
            };

            // --- LLM GENERATE FULL BOARD ---
            const handleAIFullBoardGenerate = async () => {
                if (!boardPrompt.trim()) {
                    showToast("Please supply a theme prompt first!");
                    return;
                }
                
                const key = getActiveApiKey();
                if (!key) {
                    showToast("API Key missing! Add one in setup screen settings ⚙️.");
                    return;
                }

                setIsGenerating(true);
                showToast("Gemini is constructing your custom board...");

                const schema = {
                    type: "OBJECT",
                    properties: {
                        title: { type: "STRING" },
                        categories: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    category: { type: "STRING" },
                                    questions: {
                                        type: "ARRAY",
                                        items: {
                                            type: "OBJECT",
                                            properties: {
                                                points: { type: "INTEGER" },
                                                q: { type: "STRING" },
                                                core: { type: "STRING" },
                                                prefix: { type: "STRING" }
                                            },
                                            required: ["points", "q", "core", "prefix"]
                                        }
                                    }
                                },
                                required: ["category", "questions"]
                            }
                        },
                        finalJeopardy: {
                            type: "OBJECT",
                            properties: {
                                category: { type: "STRING" },
                                question: { type: "STRING" },
                                core: { type: "STRING" },
                                prefix: { type: "STRING" }
                            },
                            required: ["category", "question", "core", "prefix"]
                        }
                    },
                    required: ["title", "categories", "finalJeopardy"]
                };

                const systemPrompt = "You are an expert trivia writer. Create a fun, engaging, and historically or scientifically accurate Jeopardy board themed precisely around the user's prompt. There must be exactly 5 categories, and each category must have exactly 5 questions with point values: 100, 200, 300, 400, and 500, increasing logically in difficulty.";
                const prompt = `Create a Jeopardy board about this theme/topic: "${boardPrompt}". Return complete question prompts, direct answer cores, and correct query prefixes (e.g., 'Who is', 'What is', 'Where is').`;

                try {
                    const result = await callGeminiAPI(prompt, systemPrompt, schema);
                    
                    // Format and sanitize output to match game rules
                    const sanitizedCategories = result.categories.slice(0, 5).map(cat => {
                        const sortedQs = cat.questions.sort((a,b) => a.points - b.points).slice(0,5);
                        // Ensure point values are clean
                        sortedQs.forEach((q, idx) => {
                            q.points = (idx + 1) * 100;
                        });
                        return {
                            category: cat.category,
                            questions: sortedQs
                        };
                    });

                    setEditedGame({
                        id: `game-${Date.now()}`,
                        title: result.title || `Theme: ${boardPrompt}`,
                        categories: sanitizedCategories,
                        finalJeopardy: {
                            category: result.finalJeopardy.category || "Final Trivia",
                            question: result.finalJeopardy.question || "",
                            core: result.finalJeopardy.core || "",
                            prefix: result.finalJeopardy.prefix || "What is"
                        }
                    });

                    showToast("🎉 Full Board Created by AI!");
                    setBoardPrompt("");
                } catch (error) {
                    console.error(error);
                    showToast(`Error: ${error.message || "Failed to contact Gemini API"}`);
                } finally {
                    setIsGenerating(false);
                }
            };

            // --- LLM GENERATE SINGLE CATEGORY ---
            const handleAISingleCategoryGenerate = async () => {
                if (!catPrompt.trim() || aiTargetCatIdx === null) {
                    showToast("Please supply a topic and select a column!");
                    return;
                }

                const key = getActiveApiKey();
                if (!key) {
                    showToast("API Key missing! Add one in setup settings.");
                    return;
                }

                setIsGenerating(true);
                showToast(`Gemini is writing Category ${aiTargetCatIdx + 1} clues...`);

                const schema = {
                    type: "OBJECT",
                    properties: {
                        category: { type: "STRING" },
                        questions: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    points: { type: "INTEGER" },
                                    q: { type: "STRING" },
                                    core: { type: "STRING" },
                                    prefix: { type: "STRING" }
                                },
                                required: ["points", "q", "core", "prefix"]
                            }
                        }
                    },
                    required: ["category", "questions"]
                };

                const systemPrompt = "You are an expert trivia developer. Generate a single category with exactly 5 questions worth 100, 200, 300, 400, and 500 points in increasing difficulty.";
                const prompt = `Create a single Jeopardy category themed around: "${catPrompt}". Create engaging clues, core answers, and appropriate grammar prefixes (like "Who is" or "What are").`;

                try {
                    const result = await callGeminiAPI(prompt, systemPrompt, schema);
                    
                    const sortedQs = result.questions.sort((a,b) => a.points - b.points).slice(0, 5);
                    sortedQs.forEach((q, idx) => {
                        q.points = (idx + 1) * 100;
                    });

                    const newCats = [...editedGame.categories];
                    newCats[aiTargetCatIdx] = {
                        category: result.category || catPrompt,
                        questions: sortedQs
                    };

                    setEditedGame({ ...editedGame, categories: newCats });
                    showToast("🎉 Category Updated with AI Content!");
                    setCatPrompt("");
                    setAiTargetCatIdx(null);
                } catch (error) {
                    console.error(error);
                    showToast(`Error: ${error.message}`);
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleDownloadTemplate = () => {
                const csv = "Category,Points,Question,Core Answer,Prefix\nCategory 1,100,\"Sample Question Here\",\"Sample Answer\",\"What is\"\nFinal: Sample Category,0,\"Sample Final Jeopardy Clue Here\",\"Sample Final Answer\",\"What is\"";
                const link = document.createElement("a");
                link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
                link.download = "jeopardy_template.csv";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Template Downloaded!");
            };

            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                Papa.parse(file, {
                    complete: (results) => {
                        const data = results.data;
                        const newCats = [];
                        const categoriesMap = {};
                        let tempFinal = { ...editedGame.finalJeopardy };
                        let startIdx = (data[0] && data[0][0].toLowerCase().includes('category')) ? 1 : 0;
                        
                        for(let i=startIdx; i<data.length; i++) {
                            const row = data[i];
                            if(row.length < 3 || !row[0]) continue;
                            const catName = row[0].trim();
                            
                            // Check if this row is designated for Final Jeopardy
                            if (catName.toLowerCase().startsWith('final:') || catName.toLowerCase() === 'final jeopardy') {
                                const finalCategory = catName.toLowerCase().startsWith('final:') 
                                    ? catName.substring(6).trim() 
                                    : "Final Category";
                                tempFinal = {
                                    category: finalCategory,
                                    question: row[2] || "",
                                    core: row[3] || "Answer",
                                    prefix: row[4] || "What is"
                                };
                                continue; // Avoid adding this to standard categories
                            }

                            if(!categoriesMap[catName]) categoriesMap[catName] = [];
                            categoriesMap[catName].push({
                                points: parseInt(row[1]) || 100,
                                q: row[2] || "",
                                core: row[3] || "Answer",
                                prefix: row[4] || "What is"
                            });
                        }
                        
                        Object.keys(categoriesMap).slice(0, 5).forEach(catName => {
                            const qs = categoriesMap[catName].sort((a,b) => a.points - b.points).slice(0, 5);
                            while(qs.length < 5) {
                                qs.push({points:(qs.length+1)*100, q:"Placeholder Question", core:"Answer", prefix:"What is"});
                            }
                            newCats.push({category: catName, questions: qs});
                        });
                        
                        if (newCats.length > 0) {
                            setEditedGame({
                                ...editedGame, 
                                categories: newCats,
                                finalJeopardy: tempFinal
                            });
                            showToast("CSV imported successfully!");
                        } else {
                            showToast("No valid categories found in CSV!");
                        }
                    }
                });
            };

            return (
                <div className="flex flex-col h-full bg-slate-950 text-white p-4 overflow-hidden">
                    {/* Action Header */}
                    <div className="flex flex-col md:flex-row justify-between mb-4 items-center gap-2">
                        <div className="flex items-center gap-3">
                            <h2 className="text-2xl font-black text-yellow-400 tracking-wide">Board Editor</h2>
                            <span className="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded">Local Storage</span>
                        </div>
                        <div className="flex flex-wrap gap-2 justify-center">
                            <button onClick={onToggleFullscreen} className="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded transition text-xs font-bold text-yellow-400">
                                {isFullscreen ? "🗗 Exit Fullscreen" : "⛶ Fullscreen"}
                            </button>
                            <button onClick={handleDownloadTemplate} className="bg-purple-700 hover:bg-purple-600 px-3 py-1.5 rounded transition text-xs font-bold">Download Blank CSV Format</button>
                            <label className="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded cursor-pointer transition text-xs flex items-center font-bold">
                                import CSV <input type="file" onChange={handleCSVUpload} className="hidden" />
                            </label>
                            <button onClick={onCancel} className="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded transition text-xs font-bold">Cancel</button>
                            <button onClick={() => onSaveAsCopy(editedGame)} className="bg-teal-700 hover:bg-teal-600 px-3 py-1.5 rounded transition text-xs font-bold">Save Copy</button>
                            <button onClick={() => onSave(editedGame)} className="bg-green-600 hover:bg-green-500 px-5 py-1.5 rounded transition font-black text-xs text-slate-950 uppercase tracking-wider">Save Game</button>
                        </div>
                    </div>

                    {/* AI Full Board Generation Dashboard */}
                    <div className="mb-4 bg-slate-900 border border-yellow-500/30 p-3 rounded-xl flex flex-col md:flex-row items-center justify-between gap-3 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="text-xl">✨</span>
                            <div>
                                <h4 className="text-xs font-black uppercase text-yellow-400 tracking-wider">AI Board Builder</h4>
                                <p className="text-[10px] text-slate-400">Generate a full custom 25-clue board in seconds with Gemini</p>
                            </div>
                        </div>
                        <div className="flex flex-grow max-w-xl w-full gap-2">
                            <input 
                                type="text"
                                value={boardPrompt}
                                onChange={(e) => setBoardPrompt(e.target.value)}
                                placeholder="Topic (e.g. World War II, MCU Movies, 10th Grade Physics)..." 
                                className="flex-grow p-1.5 text-xs text-slate-950 font-bold rounded border-2 border-yellow-500/50"
                                disabled={isGenerating}
                            />
                            <button 
                                onClick={handleAIFullBoardGenerate}
                                disabled={isGenerating}
                                className="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black text-xs px-4 py-1.5 rounded transition flex items-center gap-1.5 shrink-0"
                            >
                                {isGenerating ? "Cloning..." : "✨ Auto-Generate"}
                            </button>
                        </div>
                    </div>
                    
                    <div className="mb-4">
                        <label className="block text-xs font-bold text-yellow-400 mb-1 uppercase tracking-widest">Game Configuration Title</label>
                        <input value={editedGame.title} onChange={e => setEditedGame({...editedGame, title: e.target.value})} className="edit-input w-full p-2.5 text-black text-lg font-bold rounded shadow-inner" placeholder="Game Title (e.g., Biology Review)" />
                    </div>

                    <div className="flex border-b border-slate-800 mb-4">
                        <button className={`px-5 py-2.5 rounded-t-lg transition font-bold text-sm ${activeTab==='categories' ? 'bg-yellow-500 text-slate-950 font-black' : 'bg-slate-900 hover:bg-slate-800 text-slate-400'}`} onClick={() => setActiveTab('categories')}>Categories (5x5)</button>
                        <button className={`px-5 py-2.5 rounded-t-lg transition font-bold text-sm ${activeTab==='final' ? 'bg-yellow-500 text-slate-950 font-black' : 'bg-slate-900 hover:bg-slate-800 text-slate-400'}`} onClick={() => setActiveTab('final')}>Final Jeopardy Clue</button>
                    </div>

                    <div className="flex-grow overflow-y-auto pb-20">
                        {activeTab === 'categories' ? (
                            <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
                                {editedGame.categories.map((cat, i) => (
                                    <div key={i} className="bg-slate-900 p-3 rounded-lg border border-slate-800 shadow-xl flex flex-col gap-3 relative">
                                        
                                        {/* Row AI generation controls */}
                                        <div className="bg-slate-950 p-2 rounded border border-slate-800">
                                            <div className="flex items-center justify-between mb-1">
                                                <label className="block text-[10px] text-yellow-500 font-bold uppercase tracking-widest">Category {i+1}</label>
                                                <button 
                                                    onClick={() => setAiTargetCatIdx(aiTargetCatIdx === i ? null : i)}
                                                    className="text-xs bg-yellow-500/10 hover:bg-yellow-500/30 text-yellow-400 font-bold px-1.5 py-0.5 rounded transition flex items-center gap-1"
                                                >
                                                    ✨ AI
                                                </button>
                                            </div>
                                            <input value={cat.category} onChange={e => handleCategoryChange(i, e.target.value)} className="edit-input w-full text-black font-bold text-center rounded p-1 text-sm animate-fade-in" placeholder="Category Name" />
                                        </div>

                                        {/* AI single column builder form overlay */}
                                        {aiTargetCatIdx === i && (
                                            <div className="bg-slate-950 border border-yellow-500 p-2.5 rounded-lg text-xs space-y-2 animate-fade-in">
                                                <p className="font-bold text-yellow-400">Generate Category Topic:</p>
                                                <input 
                                                    type="text" 
                                                    value={catPrompt}
                                                    onChange={(e) => setCatPrompt(e.target.value)}
                                                    placeholder="Topic theme (e.g. Zoology, Chemistry)..."
                                                    className="w-full text-slate-950 font-semibold p-1 rounded"
                                                />
                                                <div className="flex gap-2">
                                                    <button onClick={handleAISingleCategoryGenerate} className="flex-1 bg-yellow-500 hover:bg-yellow-400 text-slate-950 py-1 rounded font-bold">✨ Gen Column</button>
                                                    <button onClick={() => setAiTargetCatIdx(null)} className="bg-slate-800 hover:bg-slate-700 px-2 rounded">Exit</button>
                                                </div>
                                            </div>
                                        )}
                                        
                                        {cat.questions.map((q, j) => (
                                            <div key={j} className="bg-slate-950 p-2.5 rounded border border-slate-800">
                                                <div className="text-yellow-400 font-bold text-xs mb-1.5 flex justify-between">
                                                    <span>Point Value</span>
                                                    <span>${q.points}</span>
                                                </div>
                                                <div className="flex flex-col gap-1.5">
                                                    <textarea value={q.q} onChange={e => handleQuestionChange(i, j, 'q', e.target.value)} className="edit-input w-full h-16 text-black text-xs rounded p-1" placeholder="Question prompt description..." />
                                                    <input value={q.core} onChange={e => handleQuestionChange(i, j, 'core', e.target.value)} className="edit-input w-full text-black text-xs rounded p-1" placeholder="Answer Core (e.g. Gravity)" />
                                                    <input value={q.prefix} onChange={e => handleQuestionChange(i, j, 'prefix', e.target.value)} className="edit-input w-full text-black text-[10px] rounded p-1" placeholder="Question format prefix (e.g. What is)" />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="bg-slate-900 p-6 rounded-xl max-w-xl mx-auto mt-6 border border-slate-800 shadow-2xl">
                                <h3 className="text-lg font-bold text-yellow-400 mb-4 text-center">Configure Final Clue</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block mb-1 text-xs font-bold text-yellow-500 uppercase tracking-wider">Final Jeopardy Category</label>
                                        <input value={editedGame.finalJeopardy.category} onChange={e => handleFinalChange('category', e.target.value)} className="edit-input w-full text-black p-2 rounded text-sm" />
                                    </div>
                                    <div>
                                        <label className="block mb-1 text-xs font-bold text-yellow-500 uppercase tracking-wider">Question Prompt Clue</label>
                                        <textarea value={editedGame.finalJeopardy.question} onChange={e => handleFinalChange('question', e.target.value)} className="edit-input w-full h-32 text-black p-2 rounded text-sm" />
                                    </div>
                                    <div>
                                        <label className="block mb-1 text-xs font-bold text-yellow-500 uppercase tracking-wider">Correct Answer Target</label>
                                        <input value={editedGame.finalJeopardy.core} onChange={e => handleFinalChange('core', e.target.value)} className="edit-input w-full text-black p-2 rounded text-sm" />
                                    </div>
                                    <div>
                                        <label className="block mb-1 text-xs font-bold text-yellow-500 uppercase tracking-wider">Grammar Prefix Format</label>
                                        <input value={editedGame.finalJeopardy.prefix} onChange={e => handleFinalChange('prefix', e.target.value)} className="edit-input w-full text-black p-2 rounded text-sm" placeholder="e.g. Who is / What is" />
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SetupScreen({ onStart, onEdit, storedGames, onDeleteRequest, lastSavedTitle, showToast, isFullscreen, onToggleFullscreen }) {
            const [numTeams, setNumTeams] = useState(2);
            const [teamNames, setTeamNames] = useState(["Team 1", "Team 2"]);
            const [selectedIdx, setSelectedIdx] = useState(0);
            
            // Custom API Key and Audio Config State
            const [tempApiKey, setTempApiKey] = useState(getActiveApiKey());
            const [tempAudioUrl, setTempAudioUrl] = useState(getCustomAudioUrl());
            const [showSettings, setShowSettings] = useState(false);

            const allGames = [defaultGameData, ...storedGames];

            useEffect(() => {
                if (lastSavedTitle) {
                    const idx = allGames.map(g => g.title).lastIndexOf(lastSavedTitle);
                    if (idx >= 0) {
                        setSelectedIdx(idx);
                    }
                }
            }, [lastSavedTitle, storedGames.length]);

            useEffect(() => {
                setTeamNames(prev => {
                    const next = [...prev];
                    if(numTeams > next.length) {
                        for(let i=next.length; i<numTeams; i++) next.push(`Team ${i+1}`);
                    } else {
                        next.length = numTeams;
                    }
                    return next;
                });
            }, [numTeams]);

            const handleSaveSettings = () => {
                localStorage.setItem('jeopardy_gemini_api_key', tempApiKey.trim());
                localStorage.setItem('jeopardy_custom_audio_url', tempAudioUrl.trim());
                showToast("⚙️ Settings and Thinking Music path saved!");
                setShowSettings(false);
            };

            return (
                <div className="flex flex-col items-center justify-center h-full bg-slate-950 text-white p-4 relative">
                    
                    {/* Top Right Actions Panel (Settings & Fullscreen) */}
                    <div className="absolute top-4 right-4 flex items-center gap-2">
                        <button 
                            onClick={onToggleFullscreen}
                            className="bg-slate-900 border border-slate-800 hover:border-yellow-500 px-4 py-2.5 rounded-full transition text-sm font-bold text-yellow-400 flex items-center gap-1.5"
                            title="Toggle Screen Mode"
                        >
                            <span>{isFullscreen ? "🗗" : "⛶"}</span>
                            <span className="hidden sm:inline text-xs">{isFullscreen ? "Exit Fullscreen" : "Fullscreen"}</span>
                        </button>
                        <button 
                            onClick={() => setShowSettings(!showSettings)}
                            className="bg-slate-900 border border-slate-800 hover:border-yellow-500 p-2.5 rounded-full transition text-xl"
                            title="API & Audio Settings"
                        >
                            ⚙️
                        </button>
                    </div>

                    <h1 className="text-6xl md:text-9xl jeopardy-font mb-4 text-yellow-400 text-center logo-glow animate-fade-in">JEOPARDY!</h1>
                    
                    {showSettings ? (
                        <div className="bg-slate-900 p-6 rounded-2xl border-2 border-yellow-500 w-full max-w-xl shadow-2xl animate-fade-in mb-6 z-10">
                            <h3 className="text-lg font-bold text-yellow-400 mb-2 uppercase tracking-wide">⚙️ Game Configuration</h3>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs text-yellow-500 font-bold mb-1 uppercase">Gemini API Key</label>
                                    <input 
                                        type="password"
                                        placeholder="Enter your Gemini API Key..."
                                        value={tempApiKey}
                                        onChange={(e) => setTempApiKey(e.target.value)}
                                        className="w-full p-2 bg-slate-950 text-white border border-slate-800 rounded font-mono text-xs"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-xs text-yellow-500 font-bold mb-1 uppercase">Final Jeopardy Audio Track (MP3/Web link)</label>
                                    <input 
                                        type="text"
                                        placeholder="Enter direct media URL or audio.com link..."
                                        value={tempAudioUrl}
                                        onChange={(e) => setTempAudioUrl(e.target.value)}
                                        className="w-full p-2 bg-slate-950 text-white border border-slate-800 rounded font-mono text-xs"
                                    />
                                    <p className="text-[10px] text-slate-400 mt-1">
                                        Defaults to your uploaded MP3 file. Plays immediately with a synth fallback if blocked or offline.
                                    </p>
                                </div>

                                <div className="flex gap-2 justify-end pt-2">
                                    <button onClick={() => setShowSettings(false)} className="bg-slate-800 text-slate-300 px-4 py-1.5 rounded text-sm hover:bg-slate-700 transition">Cancel</button>
                                    <button onClick={handleSaveSettings} className="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-5 py-1.5 rounded font-bold text-sm transition">Save Settings</button>
                                </div>
                            </div>
                        </div>
                    ) : null}

                    <div className="bg-slate-900 p-6 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-2xl transform transition hover:scale-[1.01]">
                        <div className="mb-6">
                            <label className="block text-sm font-bold text-yellow-400 mb-2 uppercase tracking-wider">Select Game Board Configuration:</label>
                            <div className="flex gap-2">
                                <select className="flex-grow p-2.5 rounded text-black font-bold border-2 border-slate-700 shadow-inner" value={selectedIdx} onChange={e => setSelectedIdx(parseInt(e.target.value))}>
                                    {allGames.map((g, i) => (
                                        <option key={i} value={i}>
                                            {g.title} {g.id === defaultGameData.id ? '(Default Blank Layout)' : '(User Config)'}
                                        </option>
                                    ))}
                                </select>
                                <button onClick={() => onEdit(allGames[selectedIdx])} className="bg-slate-700 hover:bg-slate-600 px-4 rounded text-white transition font-bold text-sm">Edit</button>
                                <button onClick={() => printHostKey(allGames[selectedIdx])} className="bg-white hover:bg-slate-200 text-slate-950 px-3 rounded transition" title="Print Key Answers">🖨️</button>
                                {allGames[selectedIdx].id !== defaultGameData.id && (
                                    <button onClick={() => onDeleteRequest(allGames[selectedIdx].id)} className="bg-red-600 hover:bg-red-500 px-3.5 rounded text-white transition">✕</button>
                                )}
                            </div>
                        </div>
                        
                        <div className="mb-6 text-center">
                            <label className="block text-sm font-bold text-yellow-400 mb-2 uppercase tracking-wider">Select Teams Participating:</label>
                            <div className="flex justify-center gap-3">
                                {[2,3,4,5,6].map(n => (
                                    <button key={n} onClick={() => setNumTeams(n)} className={`w-12 h-12 rounded-full font-bold text-xl transition transform scale-100 hover:scale-110 ${numTeams===n ? 'bg-yellow-400 text-slate-950 border-4 border-white' : 'bg-slate-800 text-white border border-slate-700'}`}>{n}</button>

                        <div className="grid grid-cols-2 gap-4 mb-8">
                            {teamNames.map((name, i) => (
                                <input key={i} value={name} onChange={e => {
                                    const n = [...teamNames]; n[i] = e.target.value; setTeamNames(n);
                                }} className="team-input px-3 py-2 rounded font-bold text-md shadow-inner" placeholder={`Team ${i+1}`} />
                            ))}
                        </div>

                        <button onClick={() => onStart(teamNames, allGames[selectedIdx])} className="w-full py-4 bg-gradient-to-r from-yellow-400 to-yellow-600 text-slate-950 font-black text-3xl rounded-xl uppercase shadow-lg transform transition hover:translate-y-[-2px] hover:shadow-2xl tracking-wide">
                            Launch Board
                        </button>
                    </div>
                </div>
            );
        }

        function GameBoard({ data, completedIds, onQuestionClick, onFinalJeopardy }) {
            return (
                <div className="h-full flex flex-col justify-between">
                    <div className="flex-none grid grid-cols-5 bg-slate-950 gap-1 p-1 border-b-4 border-slate-950">
                        {data.categories.map((cat, i) => (
                            <div key={i} className="bg-blue-900 text-center py-3 flex items-center justify-center text-yellow-100 font-bold uppercase text-xs md:text-sm lg:text-lg shadow-inner leading-tight px-1 h-14 overflow-hidden border border-blue-800">
                                {cat.category}
                            </div>
                        ))}
                    </div>
                    
                    <div className="flex-grow grid grid-cols-5 bg-slate-950 gap-1 p-1">
                        {Array.from({length:5}).map((_, r) => (
                            <React.Fragment key={r}>
                                {data.categories.map((cat, c) => {
                                    const qId = `${c}-${r}`;
                                    const done = completedIds.includes(qId);
                                    return (
                                        <button key={c} disabled={done} onClick={() => onQuestionClick(c, r)} 
                                            className={`flex items-center justify-center text-3xl md:text-5xl lg:text-6xl font-bold jeopardy-font transition duration-200 border border-blue-950
                                            ${done ? 'bg-slate-950 text-slate-800 cursor-default shadow-none' : 'bg-blue-800 text-yellow-400 hover:bg-blue-700 hover:text-yellow-200 cursor-pointer shadow-inner'}`}>
                                            {done ? '' : `$${cat.questions[r].points}`}
                                        </button>
                                    );
                                })}
                            </React.Fragment>
                        ))}
                    </div>

                    <div className="flex-none p-3 bg-slate-950 flex justify-between items-center border-t border-slate-800">
                        <button 
                            onClick={onFinalJeopardy}
                            className="px-6 py-2.5 rounded-lg font-bold uppercase transition text-sm bg-red-600 hover:bg-red-500 text-white shadow-lg cursor-pointer"
                        >
                            Final Jeopardy
                        </button>
                        <div className="text-xs text-yellow-400 font-bold">
                            BOARD COMPLETED: {completedIds.length} / 25 TILES (Final Jeopardy is open!)
                        </div>
                    </div>
                </div>
            );
        }

        function QuestionModal({ question, onClose, teams, onScoreChange, showToast }) {
            const [showAnswer, setShowAnswer] = useState(false);

            // Trigger custom localized correct confetti blast
            const triggerCorrectConfetti = () => {
                try {

                        spread: 80,

                        <div className="text-yellow-400 font-bold text-lg sm:text-2xl mb-4 text-shadow uppercase tracking-wider">

                        </div>
                        
                        <div className="text-xl md:text-3xl font-semibold mb-6 px-4 leading-relaxed min-h-[100px] flex items-center justify-center font-serif italic text-blue-100">

                        {showAnswer && (

                        <div className="flex flex-wrap justify-center gap-3 mb-6 border-t border-blue-900 pt-4">
