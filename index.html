        function FinalJeopardyModal({ data, teams, onScoreChange, onReset }) {
            const [step, setStep] = useState('wager'); 
            const [wagers, setWagers] = useState(teams.map(() => 0));
            
            // Timer and Audio configurations
            const [timeLeft, setTimeLeft] = useState(30);
            const [isTimerActive, setIsTimerActive] = useState(false);
            
            const countdownIntervalRef = useRef(null);
            const audioIntervalRef = useRef(null);
            const audioCtxRef = useRef(null);
            const melodyIdxRef = useRef(0);

            // Ref to local browser audio player
            const audioElRef = useRef(null);

            // Synthesizer backup sequencer loop
            const startSynthThinkMusic = () => {
                if (!audioCtxRef.current) {
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                const ctx = audioCtxRef.current;
                melodyIdxRef.current = 0;
                
                if (audioIntervalRef.current) clearInterval(audioIntervalRef.current);
                
                audioIntervalRef.current = setInterval(() => {
                    const currentNote = jeopardyMelody[melodyIdxRef.current];
                    if (currentNote.note > 0) {
                        playSequencedNote(currentNote.note, 'triangle', currentNote.dur, ctx);
                    }
                    melodyIdxRef.current = (melodyIdxRef.current + 1) % jeopardyMelody.length;
                }, 375); // ~160 BPM loop rate
            };

            const stopSynthThinkMusic = () => {
                if (audioIntervalRef.current) {
                    clearInterval(audioIntervalRef.current);
                    audioIntervalRef.current = null;
                }
                stopThinkMusicSynthesizer();
            };

            // Unified Play Audio controller
            const playThinkAudio = () => {
                const audioUrl = getCustomAudioUrl();
                
                // Try streaming external direct track first
                if (audioElRef.current) {
                    audioElRef.current.src = audioUrl;
                    audioElRef.current.load();
                    
                    audioElRef.current.play()
                        .then(() => {
                            console.log("Playing primary audio stream: " + audioUrl);
                        })
                        .catch(err => {
                            console.warn("Primary audio stream blocked/failed. Falling back to synthesizer.", err);
                            startSynthThinkMusic();
                        });
                } else {
                    startSynthThinkMusic();
                }
            };

            const stopThinkAudio = () => {
                if (audioElRef.current) {
                    try {
                        audioElRef.current.pause();
                        audioElRef.current.currentTime = 0;
                    } catch(e) {}
                }
                stopSynthThinkMusic();
            };

            // Toggle Timer & Music simultaneously
            const handleTimerToggle = () => {
                if (isTimerActive) {
                    // Pause
                    clearInterval(countdownIntervalRef.current);
                    stopThinkAudio();
                    setIsTimerActive(false);
                } else {
                    // Start
                    setIsTimerActive(true);
                    playThinkAudio();
                    countdownIntervalRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(countdownIntervalRef.current);
                                stopThinkAudio();
                                setIsTimerActive(false);
                                playSound('wrong'); // buzzer end of round
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
            };

            const resetTimer = () => {
                clearInterval(countdownIntervalRef.current);
                stopThinkAudio();
                setIsTimerActive(false);
                setTimeLeft(30);
            };

            // Cleanup music & intervals on state transition
            useEffect(() => {
                return () => {
                    clearInterval(countdownIntervalRef.current);
                    stopThinkAudio();
                };
            }, [step]);

            const handleWagerChange = (idx, val) => {
                const next = [...wagers];
                next[idx] = Math.max(0, parseInt(val) || 0);
                setWagers(next);
            };

            const handleFinalScore = (idx, isCorrect) => {
                const amount = wagers[idx];
                onScoreChange(idx, isCorrect ? amount : -amount);
                if (isCorrect) {
                    playSound('correct');
                    try {
                        confetti({ particleCount: 50, spread: 45 });
                    } catch (e) {}
                } else {
                    playSound('wrong');
                }
            };

            const triggerWin = () => {
                playSound('win');
                try {
                    confetti({ particleCount: 150, spread: 85, origin: { y: 0.6 } });
                } catch (e) {}
                setStep('winner');
            };

            const sortedTeams = [...teams].sort((a,b) => b.score - a.score);

            return (
                <div className="fixed inset-0 bg-slate-950 flex flex-col items-center justify-center p-4 z-50 overflow-y-auto">
                    {/* Native Hidden fail-safe Audio element */}
                    <audio ref={audioElRef} style={{ display: 'none' }} preload="auto" crossOrigin="anonymous"></audio>

                    <div className="max-w-3xl w-full bg-slate-900 border-4 border-yellow-500 p-8 rounded-2xl shadow-2xl text-center">
                        <h2 className="text-4xl font-bold text-yellow-400 mb-6 jeopardy-font tracking-widest logo-glow">FINAL JEOPARDY</h2>
                        <h3 className="text-2xl text-yellow-200 mb-6 uppercase tracking-wider font-bold">Category: {data.finalJeopardy.category}</h3>

                        {step === 'wager' && (
                            <div>
                                <p className="text-sm mb-4 text-slate-300">Enter team wagers before launching the final clue prompt:</p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                    {teams.map((team, idx) => (
                                        <div key={idx} className="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
                                            <span className="font-bold text-md truncate max-w-[60%]">{team.name} (${team.score})</span>
                                            <input type="number" value={wagers[idx]} onChange={e => handleWagerChange(idx, e.target.value)} className="w-24 p-1.5 text-black font-bold rounded text-right" placeholder="0" />
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setStep('question')} className="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black px-8 py-3 rounded-xl text-lg uppercase tracking-wider transition">Reveal Question Clue</button>
                            </div>
                        )}

                        {step === 'question' && (
                            <div className="flex flex-col items-center">
                                <p className="text-2xl md:text-3xl font-semibold mb-8 border-b border-slate-800 pb-6 leading-relaxed">"{data.finalJeopardy.question}"</p>
                                
                                {/* 30-Second Timer Panel */}
                                <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 w-full max-w-sm mb-8 text-center flex flex-col items-center shadow-lg">
                                    <div className="text-[10px] font-black uppercase text-yellow-400 tracking-widest mb-1.5">Game Clock & Music Player</div>
                                    <div className={`text-6xl font-black font-mono transition duration-300 ${timeLeft <= 5 ? 'text-red-500 animate-pulse' : 'text-yellow-400'}`}>
                                        0:{timeLeft < 10 ? `0${timeLeft}` : timeLeft}
                                    </div>
                                    <div className="flex gap-2.5 mt-4 w-full">
                                        <button 
                                            onClick={handleTimerToggle}
                                            className={`flex-1 py-2 rounded-lg font-black text-xs uppercase tracking-wider transition ${isTimerActive ? 'bg-red-600 hover:bg-red-500 text-white animate-pulse' : 'bg-green-600 hover:bg-green-500 text-white'}`}
                                        >
                                            {isTimerActive ? "⏸️ Pause Clock" : "▶️ Start Music & Clock"}
                                        </button>
                                        <button 
                                            onClick={resetTimer}
                                            className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-xs font-bold transition"
                                        >
                                            🔄 Reset
                                        </button>
                                    </div>
                                </div>

                                <button onClick={() => setStep('answer')} className="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black px-8 py-3 rounded-xl text-lg uppercase tracking-wider transition">Reveal Answer</button>
                            </div>
                        )}

                        {step === 'answer' && (
                            <div>
                                <p className="text-2xl md:text-3xl font-semibold mb-4 text-slate-300">"{data.finalJeopardy.question}"</p>
                                <p className="text-3xl font-black text-green-400 mb-8 border-t border-slate-800 pt-6 tracking-wide">{data.finalJeopardy.prefix} {data.finalJeopardy.core}?</p>
                                
                                <p className="text-xs text-slate-400 mb-4">Select team responses:</p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                    {teams.map((team, idx) => (
                                        <div key={idx} className="bg-slate-800 p-3 rounded-lg border border-slate-700 flex flex-col gap-2">
                                            <div className="flex justify-between font-bold text-sm">
                                                <span className="truncate max-w-[50%]">{team.name}</span>
                                                <span className="text-yellow-400">${team.score} (Waged: ${wagers[idx]})</span>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => handleFinalScore(idx, true)} className="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-1.5 rounded text-xs transition">Correct</button>
                                                <button onClick={() => handleFinalScore(idx, false)} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-1.5 rounded text-xs transition">Incorrect</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={triggerWin} className="bg-purple-600 hover:bg-purple-500 text-white font-black px-8 py-3 rounded-xl text-lg uppercase tracking-wider transition">Declare Winners!</button>
                            </div>
                        )}

                        {step === 'winner' && (
                            <div className="animate-fade-in flex flex-col items-center">
                                <h3 className="text-4xl font-black text-yellow-400 mb-6 jeopardy-font tracking-wider logo-glow uppercase">Final Standings</h3>
                                
                                <div className="flex justify-center items-end gap-3 sm:gap-6 h-64 mb-8 pt-6 px-2 w-full max-w-lg">
                                    {/* 2nd Place */}
                                    {sortedTeams[1] ? (
                                        <div className="flex flex-col items-center w-24 sm:w-28 transition transform hover:scale-105 duration-300">
                                            <span className="font-bold text-xs sm:text-sm truncate max-w-full mb-1 text-slate-300 text-shadow text-center px-1" title={sortedTeams[1].name}>
                                                {sortedTeams[1].name}
                                            </span>
                                            <span className="text-xs sm:text-sm text-yellow-300 font-extrabold mb-1.5">${sortedTeams[1].score}</span>
                                            <div className="podium-2 w-full flex flex-col items-center justify-center text-md sm:text-lg font-black text-slate-200 rounded-t-xl shadow-lg border-t border-l border-r border-slate-400/50">
                                                <span className="text-2xl sm:text-3xl mb-1">🥈</span>
                                                <span>2nd</span>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="w-24 sm:w-28 h-20 bg-slate-900/20 border border-slate-800/40 rounded-t-xl flex items-center justify-center text-xs text-slate-600">No Entry</div>
                                    )}

                                    {/* 1st Place */}
                                    {sortedTeams[0] ? (
                                        <div className="flex flex-col items-center w-28 sm:w-32 transition transform hover:scale-110 duration-300">
                                            <span className="font-bold text-sm sm:text-base truncate max-w-full mb-1 text-yellow-300 text-shadow text-center px-1 flex items-center gap-1 justify-center font-black" title={sortedTeams[0].name}>
                                                👑 {sortedTeams[0].name}
                                            </span>
                                            <span className="text-sm sm:text-base text-yellow-400 font-black mb-1.5">${sortedTeams[0].score}</span>
                                            <div className="podium-1 w-full flex flex-col items-center justify-center text-xl sm:text-2xl font-black text-slate-950 rounded-t-xl shadow-2xl border-t border-l border-r border-yellow-300/60">
                                                <span className="text-3xl sm:text-4xl mb-1">🥇</span>
                                                <span>1st</span>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="w-28 sm:w-32 h-28 bg-slate-900/20 border border-slate-800/40 rounded-t-xl flex items-center justify-center text-xs text-slate-600">No Entry</div>
                                    )}

                                    {/* 3rd Place */}
                                    {sortedTeams[2] ? (
                                        <div className="flex flex-col items-center w-24 sm:w-28 transition transform hover:scale-105 duration-300">
                                            <span className="font-bold text-xs sm:text-sm truncate max-w-full mb-1 text-amber-500 text-shadow text-center px-1" title={sortedTeams[2].name}>
                                                {sortedTeams[2].name}
                                            </span>
                                            <span className="text-xs sm:text-sm text-yellow-300 font-extrabold mb-1.5">${sortedTeams[2].score}</span>
                                            <div className="podium-3 w-full flex flex-col items-center justify-center text-md sm:text-lg font-black text-amber-100 rounded-t-xl shadow-lg border-t border-l border-r border-amber-700/50">
                                                <span className="text-2xl sm:text-3xl mb-1">🥉</span>
                                                <span>3rd</span>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="w-24 sm:w-28 h-16 bg-slate-900/20 border border-slate-800/40 rounded-t-xl flex items-center justify-center text-xs text-slate-600">No Entry</div>
                                    )}
                                </div>

                                {/* Additional runners-up list (Teams 4+) */}
                                {sortedTeams.length > 3 && (
                                    <div className="w-full max-w-md bg-slate-950/60 border border-slate-800 p-4 rounded-xl mb-8 text-left shadow-inner">
                                        <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 text-center border-b border-slate-800 pb-2">Runners-Up</h4>
                                        <div className="space-y-2">
                                            {sortedTeams.slice(3).map((team, idx) => {
                                                const placement = idx + 4;
                                                return (
                                                    <div key={idx} className="flex justify-between items-center text-sm px-3 py-2 bg-slate-900/50 border border-slate-800/50 rounded-lg">
                                                        <div className="flex items-center gap-3">
                                                            <span className="font-mono font-bold text-slate-500 w-6">{placement}th</span>
                                                            <span className="font-bold text-slate-200 truncate max-w-[200px]">{team.name}</span>
                                                        </div>
                                                        <span className="font-mono font-semibold text-yellow-500">${team.score}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                <button onClick={onReset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-8 py-3 rounded-xl transition shadow-lg text-sm uppercase tracking-wide">
                                    Return to Main Screen
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ScoreboardPanel({ teams }) {
            return (
                <div className="bg-slate-950 p-3 border-t-2 border-slate-900 flex justify-around items-center flex-wrap gap-2">
                    {teams.map((team, idx) => (
                        <div key={idx} className="bg-slate-900 border border-slate-800 rounded-xl px-5 py-2.5 text-center min-w-[140px] shadow-md">
                            <div className="font-bold text-xs text-yellow-200 truncate max-w-[130px]">{team.name}</div>
                            <div className="text-2xl font-black text-white tracking-wide text-shadow">${team.score}</div>
                        </div>
                    ))}
                </div>
            );
        }

        function App() {
            const [screen, setScreen] = useState('setup'); 
            const [storedGames, setStoredGames] = useState([]);
            const [currentGame, setCurrentGame] = useState(defaultGameData);
            const [lastSavedTitle, setLastSavedTitle] = useState('');
            
            // App state
            const [teams, setTeams] = useState([]);
            const [completedIds, setCompletedIds] = useState([]);
            const [activeQuestion, setActiveQuestion] = useState(null);
            const [showFinal, setShowFinal] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);

            // Modal system state
            const [dialog, setDialog] = useState({ isOpen: false, type: 'alert', title: '', message: '', onConfirm: () => {} });
            
            // Toast Notification State
            const [toastMessage, setToastMessage] = useState(null);

            useEffect(() => {
                setStoredGames(loadGamesFromStorage());
                
                const handleFullscreenChange = () => {
                    setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement));
                };

                document.addEventListener('fullscreenchange', handleFullscreenChange);
                document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
                document.addEventListener('msfullscreenchange', handleFullscreenChange);

                return () => {
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                    document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
                    document.removeEventListener('msfullscreenchange', handleFullscreenChange);
                };
            }, []);

            const toggleFullscreen = () => {
                try {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                        const docEl = document.documentElement;
                        if (docEl.requestFullscreen) docEl.requestFullscreen();
                        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                        else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                        else if (document.msExitFullscreen) document.msExitFullscreen();
                    }
                } catch (e) {
                    showToast("Fullscreen mode restricted by the host frame container.");
                }
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 4000);
            };

            const triggerDialog = (type, title, message, onConfirm) => {
                setDialog({
                    isOpen: true,
                    type,
                    title,
                    message,
                    onConfirm: () => {
                        onConfirm();
                        setDialog(prev => ({ ...prev, isOpen: false }));
                    }
                });
            };

            const handleStartGame = (teamNames, selectedGame) => {
                setTeams(teamNames.map(name => ({ name, score: 0 })));
                setCurrentGame(selectedGame);
                setCompletedIds([]);
                setShowFinal(false);
                setScreen('board');
            };

            const handleQuestionClick = (c, r) => {
                const categoryName = currentGame.categories[c].category;
                const question = currentGame.categories[c].questions[r];
                setActiveQuestion({ c, r, categoryName, ...question });
            };

            const handleQuestionClose = () => {
                setCompletedIds([...completedIds, `${activeQuestion.c}-${activeQuestion.r}`]);
                setActiveQuestion(null);
            };

            const handleScoreChange = (teamIdx, amount) => {
                const next = [...teams];
                next[teamIdx].score += amount;
                setTeams(next);
            };

            const handleSaveGame = (editedGame) => {
                saveGameToStorage(editedGame);
                const updated = loadGamesFromStorage();
                setStoredGames(updated);
                setLastSavedTitle(editedGame.title);
                setScreen('setup');
                showToast("Game Board Configuration Saved!");
            };

            const handleDeleteRequest = (gameId) => {
                triggerDialog(
                    'confirm',
                    'Delete Game?',
                    'Are you sure you want to permanently delete this game board layout configuration from your local storage?',
                    () => {
                        const remaining = deleteGameFromStorage(gameId);
                        setStoredGames(remaining);
                        showToast("Game deleted!");
                    }
                );
            };

            const handleExitRequest = () => {
                triggerDialog(
                    'confirm',
                    'Abort Game?',
                    'Are you sure you want to exit? Your active game score progress will be lost.',
                    () => setScreen('setup')
                );
            };

            if (screen === 'editor') {
                return (
                    <div className="h-full relative animate-fade-in">
                        <GameEditor 
                            game={currentGame} 
                            onSave={handleSaveGame} 
                            onSaveAsCopy={(g) => handleSaveGame({...g, id: `game-${Date.now()}`, title: g.title + " (Copy)"})}
                            onCancel={() => setScreen('setup')} 
                            showToast={showToast}
                            isFullscreen={isFullscreen}
                            onToggleFullscreen={toggleFullscreen}
                        />
                        {toastMessage && (
                            <div className="fixed bottom-4 right-4 bg-yellow-500 text-slate-950 px-4 py-2.5 rounded-xl font-bold shadow-2xl z-50 animate-bounce text-sm">
                                {toastMessage}
                            </div>
                        )}
                        <DialogModal 
                            isOpen={dialog.isOpen} 
                            type={dialog.type} 
                            title={dialog.title} 
                            message={dialog.message} 
                            onConfirm={dialog.onConfirm} 
                            onCancel={() => setDialog(prev => ({ ...prev, isOpen: false }))} 
                        />
                    </div>
                );
            }

            if (screen === 'board') {
                return (
                    <div className="h-full flex flex-col justify-between bg-slate-950 animate-fade-in">
                        <div className="flex-none bg-slate-900 p-2.5 flex justify-between items-center text-white border-b-2 border-slate-800 shadow-md">
                            <h2 className="text-lg font-bold truncate max-w-[50%]">{currentGame.title}</h2>
                            <div className="flex items-center gap-2">
                                <button onClick={toggleFullscreen} className="bg-slate-800 hover:bg-slate-700 px-4 py-1.5 text-xs rounded-lg font-bold transition text-yellow-400">
                                    {isFullscreen ? "🗗 Exit Fullscreen" : "⛶ Fullscreen"}
                                </button>
                                <button onClick={handleExitRequest} className="bg-red-700 hover:bg-red-600 px-4 py-1.5 text-xs rounded-lg font-bold transition">Exit Board</button>
                            </div>
                        </div>
                        <div className="flex-grow overflow-hidden">
                            <GameBoard 
                                data={currentGame} 
                                completedIds={completedIds} 
                                onQuestionClick={handleQuestionClick}
                                onFinalJeopardy={() => setShowFinal(true)}
                            />
                        </div>
                        <div className="flex-none">
                            <ScoreboardPanel teams={teams} />
                        </div>

                        {activeQuestion && (
                            <QuestionModal 
                                question={activeQuestion} 
                                onClose={handleQuestionClose} 
                                teams={teams} 
                                onScoreChange={handleScoreChange} 
                                showToast={showToast}
                            />
                        )}

                        {showFinal && (
                            <FinalJeopardyModal 
                                data={currentGame} 
                                teams={teams} 
                                onScoreChange={handleScoreChange} 
                                onReset={() => { setShowFinal(false); setScreen('setup'); }} 
                            />
                        )}
                        
                        {toastMessage && (
                            <div className="fixed bottom-4 right-4 bg-yellow-500 text-slate-950 px-4 py-2.5 rounded-xl font-bold shadow-2xl z-50 animate-bounce text-sm">
                                {toastMessage}
                            </div>
                        )}
                        
                        <DialogModal 
                            isOpen={dialog.isOpen} 
                            type={dialog.type} 
                            title={dialog.title} 
                            message={dialog.message} 
                            onConfirm={dialog.onConfirm} 
                            onCancel={() => setDialog(prev => ({ ...prev, isOpen: false }))} 
                        />
                    </div>
                );
            }

            return (
                <div className="h-full relative animate-fade-in">
                    <SetupScreen 
                        onStart={handleStartGame} 
                        onEdit={(game) => { setCurrentGame(game); setScreen('editor'); }} 
                        storedGames={storedGames} 
                        onDeleteRequest={handleDeleteRequest}
                        lastSavedTitle={lastSavedTitle}
                        showToast={showToast}
                        isFullscreen={isFullscreen}
                        onToggleFullscreen={toggleFullscreen}
                    />
                    {toastMessage && (
                        <div className="fixed bottom-4 right-4 bg-yellow-500 text-slate-950 px-4 py-2.5 rounded-xl font-bold shadow-2xl z-50 animate-bounce text-sm">
                            {toastMessage}
                        </div>
                    )}
                    <DialogModal 
                        isOpen={dialog.isOpen} 
                        type={dialog.type} 
                        title={dialog.title} 
                        message={dialog.message} 
                        onConfirm={dialog.onConfirm} 
                        onCancel={() => setDialog(prev => ({ ...prev, isOpen: false }))} 
                    />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
